# ecm-loadtest configuration (multi-service)
# Generated by `ecm-loadtest example-config`. Edit and pass to
# `ecm-loadtest run --config <this file>`.

# ---- Shared run-level settings ----

pattern: "sustained"                       # sustained | stress | rate_levels

sustained:
  concurrency: 10                          # virtual users PER SERVICE
  ramp_seconds: 30                         # linear ramp to full concurrency
  hold_seconds: 300                        # steady state duration
  target_rps: 0                            # 0 = unlimited, else per-second cap PER SERVICE

stress:
  stages:                                  # ladder of concurrency steps PER SERVICE
    - concurrency: 5
      duration_seconds: 60
    - concurrency: 25
      duration_seconds: 60
    - concurrency: 50
      duration_seconds: 60
    - concurrency: 100
      duration_seconds: 60

rate_levels:                               # rate-targeted pattern
  rates: [5, 25, 50, 100]                  # target req/sec values PER SERVICE
  duration_seconds: 60                     # hold each rate this long per run
  runs_per_rate: 3                         # minimum 3 per AC3
  cooldown_seconds: 30                     # between runs and between rate levels
  max_concurrency: 200                     # safety cap (in-flight requests)
  apdex_threshold_ms: 500                  # T for Apdex (4T tolerating zone)

warmup_seconds: 5                          # discard samples from first N seconds
stop_at_error_pct: 50.0                    # circuit breaker (0 = off)
default_pages: 1                           # ${pages} fallback when manifest cell empty

timeouts:
  connect_seconds: 10
  request_seconds: 60

output:
  dir: "results"                           # all per-service artifacts written here

# ---- Services to load test ----
# Comment a service out OR set `enabled: false` to skip it.

services:

  - name: "ecm-image-viewer-service"
    enabled: true
    delay_ms: 0
    mode: "online"
    template: "pdf-retrieval-service"
    environment: "idev1"
    host: "https://ecm-idev1.example.gov"
    endpoint: "/ecmimageviewer/documents/view"
    method: "POST"
    content_type: "application/json"
    body_template: '{"dcn":"${dcn}","pages":${pages}}'
    manifest:
      path: "examples/manifest.csv"
      dcn_column: "dcn"
      selection: "random"

  - name: "legacy-pdf-servlet"
    enabled: true
    delay_ms: 0
    mode: "online"
    template: "legacy-pdf-servlet"
    environment: "idev1"
    host: "https://ecm-idev1.example.gov"
    endpoint: "/legacypdfservice/retrieve"
    method: "POST"
    content_type: "application/x-www-form-urlencoded"
    body_template: "dcn=${dcn}&pages=${pages}"
    manifest:
      path: "examples/manifest.csv"
      dcn_column: "dcn"
      selection: "random"

# ---- Batch volume schedule (only consulted when a batch service is enabled) ----
batch:
  volumes: [100, 2500, 5000, 10000]
  drop_rate_per_minute: 60
  cycle_duration_minutes: 30
  runs_per_volume: 3
  cooldown_seconds: 120
  poll_interval_ms: 500
  e4931_tracking: true
